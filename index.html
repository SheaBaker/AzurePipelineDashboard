<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipelines · {{ org }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F4; --surface:#FFFFFF; --ink:#1D2733; --muted:#5C6B7A; --line:#D3DBE2;
  --passed:#2E7D5B; --failed:#B3261E; --running:#1F6FD1; --partial:#A86A12;
  --queued:#6B5CA8; --canceled:#8A95A1; --unknown:#8A95A1;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#151B22; --surface:#1D252E; --ink:#E6ECF1; --muted:#94A3B1; --line:#2D3844;
  --passed:#3F9E73; --failed:#D9483E; --running:#3D86E8; --partial:#C98A2B;
  --queued:#8A7BD0; --canceled:#6E7985; --unknown:#6E7985;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 1.0625rem/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
     padding:1.5rem clamp(1rem,3vw,2.5rem) 3rem}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--running);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.5rem;margin-bottom:1.25rem}
h1{font-size:1.75rem;line-height:1.1;margin:0;font-weight:700}
h1 small{font-weight:400;color:var(--muted);font-size:1rem;margin-left:.5rem}
#summary{font-size:1.125rem;margin:0}
#summary b{font-weight:700}
#updated{margin-left:auto;color:var(--muted);font-size:.9375rem}

#filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
#filters button{font:inherit;font-size:.9375rem;padding:.3rem .8rem;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

#banner{display:none;padding:.75rem 1rem;margin-bottom:1rem;border-left:6px solid var(--failed);
  background:var(--surface)}
#banner.show{display:block}

#board{list-style:none;margin:0;padding:0;display:grid;gap:2px;background:var(--line);
  border:2px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:8.5rem minmax(0,1.6fr) minmax(0,1fr) 11rem auto;
  align-items:center;gap:1.25rem;background:var(--surface);padding-right:1.25rem;min-height:4.25rem}
.status{align-self:stretch;display:flex;flex-direction:column;justify-content:center;
  padding:.5rem .9rem;color:#fff;font-weight:700;font-size:1.0625rem;text-decoration:none}
.status span{font-weight:400;font-size:.8125rem;opacity:.9}
.name{font-weight:700;font-size:1.1875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where{color:var(--muted);font-size:.875rem;font-weight:400;display:block}
.detail{font-size:.9375rem;overflow:hidden}
.detail .branch{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail .who{color:var(--muted);display:block}
.time{font-size:.9375rem;text-align:right}
.time .sub{display:block;color:var(--muted)}
.history{display:flex;gap:3px;align-items:flex-end;justify-content:flex-end;min-width:3rem}
.history a{display:block;width:9px;height:30px;border-radius:2px}

.st-passed{background:var(--passed)} .st-failed{background:var(--failed)}
.st-running{background:var(--running)} .st-partial{background:var(--partial)}
.st-queued{background:var(--queued)} .st-canceled{background:var(--canceled)}
.st-unknown{background:var(--unknown)}
.st-waiting{background:var(--partial)} .st-pending{background:var(--canceled)}
.status.st-running{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.status.st-running{animation:none}}

.empty{background:var(--surface);padding:2rem;color:var(--muted)}

.row .status{grid-row:span 2}
.stages{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem 0;
  padding:0 0 .7rem;margin-top:-.35rem;font-size:.875rem}
.stage{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:4px;
  color:#fff;white-space:nowrap}
.stage .t{font-weight:400;opacity:.9}
.sep{width:.8rem;height:2px;background:var(--line);flex:none}
.stage.st-running{font-weight:700;animation:pulse 2.4s ease-in-out infinite}
.stage.st-pending,.stage.st-skipped{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.stage.st-skipped{text-decoration:line-through}
.stage.st-waiting{background:transparent;color:var(--partial);box-shadow:inset 0 0 0 2px var(--partial);font-weight:700}
@media (prefers-reduced-motion:reduce){.stage.st-running{animation:none}}

[hidden]{display:none !important}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:.9375rem;border:0;background:none;color:var(--muted);padding:.3rem .95rem;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#source{margin-left:auto}
.n-queued .dot{border-color:#8A7BD0}
#updated{margin-left:0}

.flowpanel{background:#0B1220;color:#E6ECF1;border-radius:14px;padding:1.25rem 1.5rem 1rem;margin-bottom:1rem}
.flowpanel a{text-decoration:none}
.flowpanel a:hover b{text-decoration:underline}
.lanes{display:grid;gap:1.75rem}
.lanes .none{color:#8FA0B3;margin:0}
.lane-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem 1rem;margin-bottom:.9rem}
.lane-h b{font-size:1.0625rem}
.lane-h .m{color:#8FA0B3;font-size:.875rem}
.lane-h .s{margin-left:auto;font-size:.875rem;color:#C9D4DF}
.track{display:flex;align-items:flex-start;overflow-x:auto;padding-bottom:.25rem}
.node{flex:none;display:flex;flex-direction:column;align-items:center;gap:.4rem;width:9rem;text-align:center}
.node .lbl{font-size:.875rem;line-height:1.3;font-weight:700;height:2.6em;max-width:100%;display:flex;align-items:flex-end;justify-content:center}
.node .lbl span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid #3A4757;background:#141D2B;color:#8FA0B3}
.node .sub{font-size:.8125rem;color:#8FA0B3;min-height:1.2em}
.n-passed .dot{border-color:#3FB67E;background:#12382A;color:#3FB67E}
.n-partial .dot{border-color:#E0A445;background:#3A2C12;color:#E0A445}
.n-failed .dot{border-color:#F0685E;background:#3D1916;color:#F0685E}
.n-running .dot{border-color:#4C9BF5;background:#0F2A4D;animation:ring 1.8s ease-out infinite}
.n-running .dot .core{width:10px;height:10px;border-radius:50%;background:#4C9BF5}
.n-running .sub{color:#7FB8FF}
.n-waiting .dot{border-color:#E0A445;border-style:dashed;color:#E0A445}
.n-waiting .sub{color:#E0A445}
.n-skipped,.n-canceled{opacity:.55}
.link{flex:1 1 2rem;min-width:2rem;height:2px;margin-top:calc(2.6 * .875rem + .4rem + 16px);position:relative;
  background:repeating-linear-gradient(90deg,#3A4757 0 3px,transparent 3px 8px)}
.link.done{background:#3FB67E}
.link.bad{background:#F0685E}
.link.live{background:repeating-linear-gradient(90deg,#2B4F7E 0 3px,transparent 3px 8px)}
.link.live::after{content:"";position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;
  background:#4C9BF5;box-shadow:0 0 8px #4C9BF5;animation:travel 1.6s linear infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(76,155,245,.55)}100%{box-shadow:0 0 0 12px rgba(76,155,245,0)}}
@keyframes travel{from{left:0}to{left:calc(100% - 8px)}}
.panelfoot{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;margin-top:1.5rem}
.chip{border:1px solid #2A3646;border-radius:8px;padding:.3rem .7rem;font-size:.875rem;color:#C9D4DF}
.chip b{color:#4C9BF5}
.chip .ok{color:#3FB67E;font-weight:700} .chip .bad{color:#F0685E;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:1rem}
.kpis div{padding:1rem .5rem;text-align:center;display:grid;gap:.15rem}
.kpis div+div{border-left:1px solid var(--line)}
.kpis .k{color:var(--muted);font-size:.875rem}
.kpis b{font-size:1.5rem}
.good{color:var(--passed)} .warn{color:var(--partial)} .crit{color:var(--failed)} .calm{color:var(--muted)}

.controls{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:end;margin-bottom:1rem}
.controls label{display:grid;gap:.35rem;font-size:.875rem;color:var(--muted)}
.controls select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;min-width:14rem}
.controls .grp{display:grid;gap:.35rem;font-size:.875rem;color:var(--muted)}

.log{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.25rem}
.log h2{font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .25rem}
.log ul{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.1rem 1rem;padding:.65rem 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .t{font-weight:700;text-decoration:none}
.log .t:hover{text-decoration:underline}
.log .num{font-family:ui-monospace,Consolas,monospace;font-size:.8125rem;background:var(--paper);padding:.05rem .4rem;border-radius:4px;margin:0 .45rem}
.log .brn{color:var(--muted);font-size:.875rem}
.log .by{color:var(--muted);font-size:.875rem}
.log .st{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:.9375rem;text-align:right}
.tx-passed{color:var(--passed)} .tx-failed{color:var(--failed)} .tx-running{color:var(--running)}
.tx-partial,.tx-waiting{color:var(--partial)} .tx-pending{color:var(--muted)} .tx-queued{color:var(--queued)} .tx-canceled,.tx-unknown{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.n-running .dot,.link.live::after{animation:none}}
@media (max-width:640px){.kpis b{font-size:1.2rem}.flowpanel{padding:1rem}}

@media (max-width:860px){
  .row{grid-template-columns:7rem minmax(0,1fr);gap:.35rem 1rem;padding:0 1rem .75rem 0}
  .row .status{grid-row:span 5}
  .stages{grid-column:2;margin-top:0}
  .time{text-align:left} .history{justify-content:flex-start}
}
</style>
</head>
<body>
<header>
  <h1>Pipelines<small>{{ org }}</small></h1>
  <p id="summary" aria-live="polite">Loading…</p>
  <div id="source" class="seg" role="tablist" aria-label="Source">
    <button type="button" role="tab" data-s="builds">Builds</button>
    <button type="button" role="tab" data-s="releases">Releases</button>
  </div>
  <div id="tabs" class="seg" role="tablist" aria-label="View">
    <button type="button" role="tab" data-v="board">Board</button>
    <button type="button" role="tab" data-v="flow">Live flow</button>
  </div>
  <span id="updated"></span>
</header>
<div id="filters" role="group" aria-label="Filter by project"></div>
<div id="banner" role="alert"></div>
<ul id="board"></ul>
<section id="flow" hidden>
  <div class="flowpanel">
    <div class="lanes" id="lanes"></div>
    <div class="panelfoot"><span class="chip" id="activeChip"></span><span class="chip" id="pollChip"></span></div>
  </div>
  <div class="kpis">
    <div><span class="k">Success rate</span><b id="kSuccess">–</b></div>
    <div><span class="k">Avg duration</span><b id="kDuration">–</b></div>
    <div><span class="k">Active alerts</span><b id="kAlerts">–</b></div>
  </div>
  <div class="controls">
    <label>Branch <select id="branch"><option value="">All branches</option></select></label>
    <div class="grp">Run health
      <div class="seg" id="health"><button type="button" data-h="all">All pipelines</button><button type="button" data-h="failing">Failing only</button></div>
    </div>
  </div>
  <div class="log"><h2 id="logTitle">Recent runs</h2><ul id="log"></ul></div>
</section>

<script>
const POLL = {{ poll }};
const LABEL = {running:"Running",failed:"Failed",queued:"Queued",partial:"Partial",
               canceled:"Canceled",passed:"Passed",unknown:"Unknown",
               pending:"Not started",skipped:"Skipped",waiting:"Awaiting approval"};
let data = {pipelines:[], updated:null, error:null};
const hashQ = new URLSearchParams(location.hash.slice(1));
let project = hashQ.get("project") || "";
let view = hashQ.get("view") === "flow" ? "flow" : "board";
let source = hashQ.get("src") === "releases" ? "releases" : "builds";
const word = st => (source === "releases" && st === "running") ? "Deploying" : LABEL[st];
const ACTIVE = s => s === "running" || s === "queued" || s === "waiting";
const runSecs = r => r.duration ?? ((r.started && r.finished) ? (Date.parse(r.finished) - Date.parse(r.started)) / 1000 : null);
const srcError = () => data.error || (source === "releases" ? data.release_error : null);
let branch = "", health = "all", branchKey = "";

function saveHash(){
  const q = new URLSearchParams();
  if (project) q.set("project", project);
  if (view !== "board") q.set("view", view);
  if (source !== "builds") q.set("src", source);
  const h = q.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname);
}
const isStale = () => data.updated && (Date.now() - Date.parse(data.updated)) / 1000 > POLL * 3;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function span(sec){
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "s";
  const m = Math.floor(sec/60), s = sec%60;
  if (m < 60) return m + "m " + String(s).padStart(2,"0") + "s";
  const h = Math.floor(m/60);
  return h < 24 ? h + "h " + (m%60) + "m" : Math.floor(h/24) + "d " + (h%24) + "h";
}
function ago(iso){
  const sec = (Date.now() - Date.parse(iso))/1000;
  if (sec < 60) return "just now";
  if (sec < 3600) return Math.floor(sec/60) + " min ago";
  if (sec < 86400) return Math.floor(sec/3600) + " h ago";
  return Math.floor(sec/86400) + " d ago";
}

function timeCell(r){
  if (r.state === "running" && r.started)
    return `<span data-since="${esc(r.started)}">${span((Date.now()-Date.parse(r.started))/1000)}</span>
            <span class="sub">${esc(r.stage || "in progress")}</span>`;
  if (r.state === "queued" && r.queued)
    return `Waiting <span data-since="${esc(r.queued)}">${span((Date.now()-Date.parse(r.queued))/1000)}</span>
            <span class="sub">for an agent</span>`;
  if (r.state === "waiting")
    return `Awaiting approval<span class="sub">${esc(r.stage || "")}</span>`;
  if (r.finished) {
    const d = runSecs(r);
    return `<span data-ago="${esc(r.finished)}">${ago(r.finished)}</span>
            <span class="sub">${d != null ? "took " + span(d) : ""}</span>`;
  }
  if (r.state === "pending") return `Not deployed<span class="sub">waiting for a manual deploy</span>`;
  return "";
}

function stageTrack(r){
  if (!r.stages || !r.stages.length) return "";
  const items = r.stages.map(s => {
    let t = "";
    if (s.state === "running" && s.started)
      t = `<span class="t" data-since="${esc(s.started)}">${span((Date.now()-Date.parse(s.started))/1000)}</span>`;
    else if (s.state === "waiting")
      t = `<span class="t">awaiting approval</span>`;
    else if (runSecs(s) != null)
      t = `<span class="t">${span(runSecs(s))}</span>`;
    return `<span class="stage st-${s.state}" title="${esc(s.name)}: ${LABEL[s.state] || s.state}">${esc(s.name)}${t}</span>`;
  });
  return `<div class="stages" aria-label="Stages">${items.join('<span class="sep" aria-hidden="true"></span>')}</div>`;
}

const ICON = {
  passed:'<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  failed:'<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  partial:'<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3.5v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor"/></svg>',
  waiting:'<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 4.5v7M10 4.5v7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  canceled:'<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 8h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  running:'<span class="core"></span>'
};
ICON.skipped = ICON.canceled;

function node(s){
  let sub = "";
  if (s.state === "running" && s.started)
    sub = `<span data-since="${esc(s.started)}">${span((Date.now()-Date.parse(s.started))/1000)}</span>`;
  else if (s.state === "waiting") sub = "approval";
  else if (runSecs(s) != null) sub = span(runSecs(s));
  return `<div class="node n-${s.state}" title="${esc(s.name)}: ${LABEL[s.state] || s.state}">
    <span class="lbl"><span>${esc(s.name)}</span></span><span class="dot">${ICON[s.state] || ""}</span><span class="sub">${sub}</span></div>`;
}

function laneStatus(r){
  if (r.state === "running" && r.started)
    return `${word("running")} <span data-since="${esc(r.started)}">${span((Date.now()-Date.parse(r.started))/1000)}</span>`;
  if (r.state === "queued") return "Waiting for an agent";
  if (r.state === "waiting") return `Awaiting approval${r.stage ? " · " + esc(r.stage) : ""}`;
  if (r.state === "pending") return "Not deployed";
  return `${LABEL[r.state]}${r.finished ? " " + ago(r.finished) : ""}`;
}

function lane(p){
  const r = p.latest;
  const st = (r.stages && r.stages.length) ? r.stages
    : [{name: "Run", state: r.state, started: r.started, finished: r.finished}];
  const parts = [];
  st.forEach((s, i) => {
    if (i) {
      const prev = st[i-1];
      let cls = "";
      if (prev.state === "running") cls = "live";
      else if (s.state === "failed") cls = "bad";
      else if ((prev.state === "passed" || prev.state === "partial") && s.state !== "pending" && s.state !== "skipped") cls = "done";
      parts.push(`<div class="link ${cls}" aria-hidden="true"></div>`);
    }
    parts.push(node(s));
  });
  return `<div class="lane">
    <div class="lane-h"><a href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(p.name)}</b></a>
      <span class="m">${esc(p.project)} · ${esc(r.number)} · ${esc(r.branch)}</span>
      <span class="s">${laneStatus(r)}</span></div>
    <div class="track">${parts.join("")}</div></div>`;
}

function logStatus(r){
  if (r.state === "running") return `${word("running")}${r.stage ? " · " + esc(r.stage) : ""}`;
  if (r.state === "queued") return "Queued";
  if (r.state === "waiting") return `Awaiting approval${r.stage ? " · " + esc(r.stage) : ""}`;
  if (r.state === "pending") return "Not deployed";
  return `${LABEL[r.state]}${r.finished ? " " + ago(r.finished) : ""}`;
}

function renderFlow(list){
  const branches = [...new Set(list.map(p => p.latest.branch).filter(Boolean))].sort();
  const sel = document.getElementById("branch");
  const key = branches.join("\n");
  if (key !== branchKey) {  // only rebuild when the set changes, so an open dropdown isn't reset
    branchKey = key;
    sel.innerHTML = `<option value="">All branches</option>` +
      branches.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join("");
  }
  if (branch && !branches.includes(branch)) branch = "";
  sel.value = branch;
  document.querySelectorAll("#health button").forEach(b => b.setAttribute("aria-pressed", b.dataset.h === health));

  let rows = list.filter(p => !branch || p.latest.branch === branch);
  if (health === "failing") rows = rows.filter(p => p.latest.state === "failed");

  const active = rows.filter(p => ACTIVE(p.latest.state));
  const shown = (active.length ? active : rows.slice(0, 3)).slice(0, 6);
  document.getElementById("lanes").innerHTML = shown.length
    ? (active.length ? "" : `<p class="none">Nothing ${source === "releases" ? "deploying" : "running"} right now. Showing the most recent ${source === "releases" ? "releases" : "runs"}.</p>`) + shown.map(lane).join("")
    : `<p class="none">No pipelines match these filters.</p>`;

  document.getElementById("activeChip").innerHTML = `Active ${source === "releases" ? "releases" : "runs"}: <b>${active.length}</b>`;
  document.getElementById("pollChip").innerHTML = srcError() ? `Poller: <span class="bad">error</span>`
    : isStale() ? `Poller: <span class="bad">stale</span>` : `Poller: <span class="ok">healthy</span>`;

  const states = rows.flatMap(p => [...p.history.map(h => h.state), p.latest.state]);
  const done = states.filter(s => s === "passed" || s === "failed" || s === "partial");
  const ks = document.getElementById("kSuccess");
  if (done.length) {
    const pct = Math.round(done.filter(s => s === "passed").length / done.length * 1000) / 10;
    ks.textContent = pct + "%";
    ks.className = pct >= 90 ? "good" : pct >= 70 ? "warn" : "crit";
  } else { ks.textContent = "–"; ks.className = "calm"; }

  const durs = rows.map(p => p.latest).filter(r => r.finished).map(runSecs).filter(d => d != null);
  document.getElementById("kDuration").textContent = durs.length ? span(durs.reduce((a, b) => a + b, 0) / durs.length) : "–";

  const alerts = rows.filter(p => p.latest.state === "failed").length;
  const ka = document.getElementById("kAlerts");
  ka.textContent = alerts ? alerts + (alerts === 1 ? " failing" : " failing") : "None";
  ka.className = alerts ? "crit" : "calm";

  document.getElementById("log").innerHTML = rows.length ? rows.slice(0, 30).map(p => {
    const r = p.latest;
    return `<li><div><a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(p.name)}</a><span class="num">${esc(r.number)}</span><span class="brn">(${esc(r.branch)})</span></div>
      <div class="by">${esc(p.project)} · triggered by ${esc(r.who || "unknown")}</div>
      <div class="st tx-${r.state}">${logStatus(r)}</div></li>`;
  }).join("") : `<li><span class="by">No runs match these filters.</span></li>`;
}

function render(){
  const all = (source === "releases" ? data.releases : data.pipelines) || [];
  document.querySelectorAll("#source button").forEach(b => b.setAttribute("aria-selected", b.dataset.s === source));
  document.getElementById("logTitle").textContent = source === "releases" ? "Recent releases" : "Recent runs";
  const projects = [...new Set(all.map(p => p.project))];
  const f = document.getElementById("filters");
  f.innerHTML = projects.length > 1
    ? ["", ...projects].map(p => `<button type="button" data-p="${esc(p)}" aria-pressed="${p===project}">${p ? esc(p) : "All projects"}</button>`).join("")
    : "";

  const list = project ? all.filter(p => p.project === project) : all;
  const n = s => list.filter(p => p.latest.state === s).length;
  const parts = [];
  if (n("running")) parts.push(`<b>${n("running")}</b> ${source === "releases" ? "deploying" : "running"}`);
  if (n("waiting")) parts.push(`<b>${n("waiting")}</b> awaiting approval`);
  if (n("failed"))  parts.push(`<b>${n("failed")}</b> failing`);
  if (n("queued"))  parts.push(`<b>${n("queued")}</b> queued`);
  parts.push(`<b>${n("passed")}</b> passing`);
  document.getElementById("summary").innerHTML = list.length ? parts.join(", ") : "";

  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === view));
  const board = document.getElementById("board");
  board.hidden = view !== "board";
  document.getElementById("flow").hidden = view !== "flow";
  if (view === "flow") { renderFlow(list); return; }
  if (!list.length){
    board.innerHTML = `<li class="empty">${data.updated
      ? (source === "releases"
          ? (data.release_error ? "Releases couldn't be loaded. See the banner above." : "No releases found. Check AZDO_PROJECTS, or raise LOOKBACK_RELEASES if these deploy rarely.")
          : "No runs found. Check AZDO_PROJECTS, or raise LOOKBACK_BUILDS if these pipelines run rarely.")
      : "Waiting for the first poll of Azure DevOps."}</li>`;
    return;
  }
  board.innerHTML = list.map(p => {
    const r = p.latest;
    const where = projects.length > 1 ? esc(p.project) + (p.folder ? " / " + esc(p.folder) : "") : esc(p.folder);
    const hist = p.history.map(h =>
      `<a class="st-${h.state}" href="${esc(h.url)}" target="_blank" rel="noopener"
          title="${esc(h.number)}: ${LABEL[h.state]}" aria-label="Run ${esc(h.number)}, ${LABEL[h.state]}"></a>`).join("");
    return `<li class="row">
      <a class="status st-${r.state}" href="${esc(r.url)}" target="_blank" rel="noopener">${word(r.state)}<span>${esc(r.number)}</span></a>
      <div class="name" title="${esc(p.name)}">${esc(p.name)}${where ? `<span class="where">${where}</span>` : ""}</div>
      <div class="detail"><span class="branch" title="${esc(r.branch)}">${esc(r.branch)}</span><span class="who">${esc(r.who)}</span></div>
      <div class="time">${timeCell(r)}</div>
      <div class="history" aria-label="Earlier runs, oldest first">${hist}</div>
      ${stageTrack(r)}
    </li>`;
  }).join("");
}

function renderMeta(){
  const u = document.getElementById("updated"), b = document.getElementById("banner");
  const stale = isStale();
  u.textContent = data.updated ? "Updated " + ago(data.updated) : "";
  const err = srcError();
  const msg = err
    ? `Can't ${source === "releases" && !data.error ? "load releases" : "reach Azure DevOps"}: ${esc(err)} Showing the last good data.`
    : stale ? "Data hasn't refreshed in a while. Check the dashboard service on the Ansible host." : "";
  b.innerHTML = msg; b.classList.toggle("show", !!msg);
}

async function refresh(){
  try {
    const r = await fetch("/api/state", {cache:"no-store"});
    data = await r.json();
    render();
  } catch (e) {
    data.error = "the dashboard server isn't responding.";
  }
  renderMeta();
}

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  project = btn.dataset.p;
  saveHash();
  render();
});
document.getElementById("source").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  source = btn.dataset.s; project = ""; branch = ""; branchKey = ""; saveHash(); render(); renderMeta();
});
document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  view = btn.dataset.v; saveHash(); render();
});
document.getElementById("branch").addEventListener("change", e => { branch = e.target.value; render(); });
document.getElementById("health").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  health = btn.dataset.h; render();
});

setInterval(() => {  // tick running timers without a full re-render
  document.querySelectorAll("[data-since]").forEach(el => el.textContent = span((Date.now()-Date.parse(el.dataset.since))/1000));
  document.querySelectorAll("[data-ago]").forEach(el => el.textContent = ago(el.dataset.ago));
}, 1000);
setInterval(renderMeta, 5000);
setInterval(refresh, 5000);
refresh();
</script>
</body>
</html>
